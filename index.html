<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>apologynote — say sorry, beautifully</title>
<meta name="description" content="Make a tiny gift of an apology: photos, a letter, a song, a dandelion wish and a flower that grows. Share it with one short link.">
<meta name="theme-color" content="#f4e8d6">
<meta property="og:title" content="apologynote — a little something to say sorry">
<meta property="og:description" content="Photos, a letter, a song, a dandelion and a flower that grows. Open it.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23b4455a'/%3E%3Ctext x='16' y='23' font-size='20' text-anchor='middle' fill='%23fff' font-family='serif'%3E%E2%9D%80%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fffaf1; --paper2:#f7ecda; --ink:#3d2a2b; --soft:#7b6264; --line:rgba(80,50,40,.14);
  --ac:#b4455a; --ac2:#e8a0ae; --acd:#8c2d42; --glow:rgba(180,69,90,.25);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --hand:'Caveat','Segoe Script','Bradley Hand',cursive; --sans:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:22px; --sh:0 18px 40px -18px rgba(70,35,30,.35),0 2px 0 rgba(255,255,255,.7) inset;
}
[data-theme=rose]{--ac:#b4455a;--ac2:#e8a0ae;--acd:#8c2d42;--glow:rgba(180,69,90,.25)}
[data-theme=midnight]{--ac:#4a5f9c;--ac2:#a9b7e6;--acd:#2f3f73;--glow:rgba(74,95,156,.25)}
[data-theme=sage]{--ac:#5f8a6b;--ac2:#b5d3b9;--acd:#3d6249;--glow:rgba(95,138,107,.25)}
[data-theme=sunset]{--ac:#d9703a;--ac2:#f5bd8f;--acd:#a64d1f;--glow:rgba(217,112,58,.25)}
[data-theme=lavender]{--ac:#8a6bb8;--ac2:#cdbbe8;--acd:#5f4488;--glow:rgba(138,107,184,.25)}
[data-theme=paper]{--ac:#8b6b4a;--ac2:#d9c2a2;--acd:#5f4630;--glow:rgba(139,107,74,.25)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#f1e4d0;min-height:100vh;overflow-x:hidden;line-height:1.55;font-size:16px}
#bg{position:fixed;inset:0;z-index:-2;background:#f1e4d0 center/cover no-repeat;transition:opacity .6s}
#bg.paper{background-size:100% auto;background-position:top center;background-repeat:repeat-y}
#bgv{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(255,248,236,.25),rgba(255,248,236,.05) 40%,rgba(255,248,236,.35))}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.1;margin:0}
a{color:var(--acd)}
button{font:inherit;color:inherit}
.hand{font-family:var(--hand);font-weight:700}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
/* header */
.top{position:sticky;top:0;z-index:30;backdrop-filter:blur(10px);background:rgba(255,248,236,.72);border-bottom:1px solid var(--line)}
.top .in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--serif);font-weight:700;font-size:23px;color:var(--ink);text-decoration:none;letter-spacing:.2px}
.brand i{font-style:normal;color:var(--ac);margin-right:5px}
.nav{display:flex;gap:2px;align-items:center}
.nav a{font-size:14px;font-weight:700;color:var(--soft);text-decoration:none;padding:7px 11px;border-radius:99px}
.nav a:hover{background:rgba(180,69,90,.1);color:var(--acd)}
.burger{display:none;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:7px 12px;font-weight:800;cursor:pointer}
@media(max-width:640px){.nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;background:var(--paper);padding:10px;border-bottom:1px solid var(--line)}.nav.open{display:flex}.burger{display:block}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;cursor:pointer;text-decoration:none;font-weight:800;font-size:16px;padding:14px 26px;border-radius:99px;background:var(--ac);color:#fff;box-shadow:0 10px 24px -10px var(--ac),0 -3px 0 rgba(0,0,0,.12) inset;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(1px)}
.btn.ghost{background:rgba(255,250,241,.85);color:var(--acd);box-shadow:0 0 0 1.5px var(--ac2) inset}
.btn.sm{padding:9px 16px;font-size:14px}
.btn.big{font-size:18px;padding:17px 34px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.center{justify-content:center;text-align:center}
/* paper card */
.card{position:relative;background:var(--paper);border-radius:var(--r);padding:26px 22px;box-shadow:var(--sh);border:1px solid rgba(120,80,60,.1)}
.card.tape::before{content:"";position:absolute;top:-13px;left:50%;width:96px;height:28px;transform:translateX(-50%) rotate(-2deg);background:repeating-linear-gradient(45deg,rgba(232,160,174,.65) 0 8px,rgba(255,255,255,.55) 8px 16px);box-shadow:0 2px 6px rgba(0,0,0,.12);border-radius:3px}
.glass{background:rgba(255,250,241,.82);backdrop-filter:blur(6px)}
.eyebrow{font-family:var(--hand);font-size:25px;color:var(--ac);display:block;margin-bottom:4px}
.h1{font-size:clamp(40px,10vw,64px)}.h2{font-size:clamp(30px,7vw,42px)}
.lead{font-size:18px;color:var(--soft);max-width:34em}
.orn{color:var(--ac);letter-spacing:.6em;text-align:center;opacity:.8;margin:18px 0}
section.blk{padding:46px 0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.g3{grid-template-columns:1fr}.g2.keep{grid-template-columns:1fr 1fr}}
/* reveal */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .9s both}
/* forms */
label.f{display:block;font-weight:800;font-size:14px;margin:16px 0 6px;color:var(--ink)}
label.f small{font-weight:600;color:var(--soft)}
input[type=text],textarea,select{width:100%;font:inherit;background:#fffdf8;border:1.5px solid rgba(120,80,60,.2);border-radius:14px;padding:12px 14px;color:var(--ink);outline:0}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 4px var(--glow)}
textarea{min-height:170px;resize:vertical;font-family:var(--hand);font-size:22px;line-height:1.35}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid rgba(120,80,60,.2);background:#fffdf8;border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.mk{width:44px;height:44px;border-radius:14px;font-size:22px;padding:0;display:grid;place-items:center;font-family:var(--serif)}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.2);cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--ink)}
.opt{border:2px solid transparent;border-radius:16px;overflow:hidden;cursor:pointer;background:#fff;padding:0;position:relative;aspect-ratio:3/4;box-shadow:0 6px 14px -8px rgba(0,0,0,.4)}
.opt img,.opt span.im{width:100%;height:100%;object-fit:cover;display:block;background-size:cover;background-position:center}
.opt.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
.opt b{position:absolute;left:0;right:0;bottom:0;padding:5px;background:rgba(255,250,241,.9);font-size:12px;text-align:center}
.step{display:flex;align-items:center;gap:10px;margin:0 0 8px}
.step em{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--serif);font-size:18px}
.step h3{font-size:26px}
.hint{font-size:13.5px;color:var(--soft)}
.ph{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.ph img{width:70px;height:70px;object-fit:cover;border-radius:10px;flex:none;border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.ph button.x{border:0;background:none;color:var(--acd);font-weight:800;cursor:pointer;font-size:20px}
/* toast */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,40px);background:var(--ink);color:#fff;padding:11px 20px;border-radius:99px;opacity:0;transition:.35s;z-index:99;font-weight:700;font-size:14px;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(40,20,20,.55);z-index:80;display:grid;place-items:center;padding:20px;backdrop-filter:blur(3px)}
.modal .card{max-width:340px;width:100%;text-align:center}
/* footer */
.foot{padding:40px 18px 70px;text-align:center;color:var(--soft);font-size:14px}
.foot a{margin:0 8px;font-weight:700}
/* home */
.hero{padding:64px 0 30px;text-align:center}
.hero .h1{margin:8px 0 14px}
.hero .lead{margin:0 auto 24px}
.steps6{counter-reset:s}
.sg{display:flex;gap:14px;align-items:flex-start}
.sg .ic{font-size:30px;color:var(--ac);width:44px;flex:none;text-align:center;font-family:var(--serif)}
.sg h3{font-size:24px;margin-bottom:2px}.sg p{margin:0;color:var(--soft);font-size:15px}
.tcard{cursor:pointer;text-align:left}
.tcard .mk2{font-size:28px;color:var(--ac)}
.tcard h3{font-size:24px;margin:4px 0}.tcard p{margin:0;font-size:14px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
details{background:var(--paper);border-radius:16px;padding:14px 18px;margin-bottom:10px;border:1px solid var(--line)}
summary{font-weight:800;cursor:pointer;font-family:var(--serif);font-size:20px}
details p{margin:8px 0 0;color:var(--soft)}
/* journey nav */
.jn{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none}
.jn .bar{pointer-events:auto;display:flex;gap:6px;align-items:center;background:rgba(255,250,241,.92);backdrop-filter:blur(8px);border-radius:99px;padding:6px 8px;box-shadow:0 10px 30px -10px rgba(60,30,30,.5);border:1px solid var(--line)}
.jn a.d{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;text-decoration:none;color:var(--soft);font-family:var(--serif);font-size:18px}
.jn a.d.on{background:var(--ac);color:#fff}.jn a.d.done{color:var(--ac)}
.jn .mus{border:0;background:none;width:34px;height:34px;font-size:18px;cursor:pointer;color:var(--ac);border-radius:50%}
.jn .mus.play{animation:pulse 1.6s infinite}
@keyframes pulse{50%{background:var(--glow)}}
.pg{min-height:100vh;padding:34px 0 120px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.pg>.wrap{width:100%}
.next{margin-top:26px;text-align:center}
.title{text-align:center;margin-bottom:22px}
.title h2{font-size:clamp(34px,9vw,52px)}
/* cover / envelope */
.env{position:relative;width:min(340px,86vw);height:230px;margin:30px auto 10px;perspective:900px;cursor:pointer}
.env .back{position:absolute;inset:0;background:linear-gradient(#e9c9a7,#dcb58f);border-radius:8px;box-shadow:0 22px 40px -16px rgba(70,35,30,.55)}
.env .lt{position:absolute;left:14px;right:14px;top:18px;bottom:14px;background:var(--paper);border-radius:6px;padding:16px;text-align:center;transition:transform .9s .35s cubic-bezier(.3,.9,.3,1);box-shadow:0 2px 8px rgba(0,0,0,.12);font-family:var(--hand);font-size:25px;line-height:1.1;color:var(--ink);display:flex;align-items:flex-end;justify-content:center}
.env .fr{position:absolute;inset:0;border-radius:8px;overflow:hidden;pointer-events:none}
.env .fr::before,.env .fr::after{content:"";position:absolute;bottom:0;width:0;height:0;border-bottom:121px solid #e6c3a0}
.env .fr::before{left:0;border-right:180px solid transparent;border-bottom-color:#e2bb96}
.env .fr::after{right:0;border-left:180px solid transparent;border-bottom-color:#e2bb96}
.env .flap{position:absolute;left:0;right:0;top:0;height:125px;transform-origin:top;transition:transform .8s ease,z-index 0s .4s;z-index:3;filter:drop-shadow(0 4px 4px rgba(0,0,0,.18))}
.env .flap::before{content:"";position:absolute;inset:0;background:linear-gradient(#e8c8a6,#dcb28b);clip-path:polygon(0 0,100% 0,50% 100%)}
.env .seal{position:absolute;left:50%;top:92px;width:46px;height:46px;margin-left:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--ac2),var(--ac) 55%,var(--acd));color:#fff;display:grid;place-items:center;font-size:22px;z-index:4;box-shadow:0 4px 10px rgba(0,0,0,.35);transition:opacity .3s;font-family:var(--serif)}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .lt{transform:translateY(-120px)}
.env.open .seal{opacity:0}
/* photos */
.polaroids{display:grid;grid-template-columns:1fr 1fr;gap:22px 14px;padding:10px 4px}
.pol{background:#fff;padding:10px 10px 8px;box-shadow:0 14px 26px -12px rgba(60,30,20,.55);transform:rotate(var(--rot,-3deg));position:relative;transition:transform .3s}
.pol:nth-child(2){--rot:3deg;margin-top:20px}.pol:nth-child(3){--rot:2deg}.pol:nth-child(4){--rot:-2.5deg;margin-top:20px}
.pol:hover{transform:rotate(0) scale(1.04);z-index:3}
.pol img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#eee}
.pol p{margin:6px 0 0;font-family:var(--hand);font-size:21px;text-align:center;line-height:1.1;min-height:1.1em}
.pol::before{content:"";position:absolute;top:-10px;left:50%;width:60px;height:20px;margin-left:-30px;background:rgba(232,160,174,.7);transform:rotate(-3deg)}
.pol.solo{grid-column:1/-1;max-width:300px;margin:0 auto}
/* letter */
.paperl{background:#fffdf6 repeating-linear-gradient(transparent 0 35px,rgba(120,150,190,.25) 35px 36px);padding:26px 22px 28px 40px;border-radius:6px;box-shadow:var(--sh);position:relative;background-position:0 14px}
.paperl::before{content:"";position:absolute;left:30px;top:0;bottom:0;width:2px;background:rgba(214,100,110,.4)}
.paperl .to{font-family:var(--hand);font-size:30px;color:var(--acd);line-height:36px}
.paperl .tx{font-family:var(--hand);font-size:25px;line-height:36px;white-space:pre-wrap;color:#33262a;margin:0}
.paperl .sg2{font-family:var(--hand);font-size:30px;text-align:right;color:var(--acd);line-height:36px;margin-top:14px}
.cur::after{content:"|";animation:blink 1s steps(1) infinite;color:var(--ac)}
@keyframes blink{50%{opacity:0}}
/* song */
.vinyl{width:min(260px,70vw);aspect-ratio:1;border-radius:50%;margin:10px auto 24px;background:radial-gradient(circle,var(--ac) 0 17%,#222 17.5% 19%,#171717 19.5% 35%,#262626 35.5% 36.5%,#141414 37% 62%,#2a2a2a 62.5% 63.5%,#121212 64% 100%);box-shadow:0 24px 40px -14px rgba(0,0,0,.6);position:relative;display:grid;place-items:center;color:#fff;font-family:var(--hand);font-size:20px;text-align:center}
.vinyl.spin{animation:spin 5s linear infinite}
.vinyl::after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--paper)}
@keyframes spin{to{transform:rotate(360deg)}}
.eq{display:flex;gap:5px;justify-content:center;height:34px;align-items:flex-end;margin:6px 0 14px}
.eq i{width:6px;border-radius:3px;background:var(--ac);height:6px;transition:height .2s}
.eq.on i{animation:eq 1s ease-in-out infinite alternate}
.eq i:nth-child(2n){animation-delay:.2s}.eq i:nth-child(3n){animation-delay:.45s}.eq i:nth-child(5n){animation-delay:.1s}
@keyframes eq{from{height:5px}to{height:32px}}
/* dandelion */
.dstage{position:relative;height:420px;max-width:420px;margin:0 auto}
.dstage svg.stem{position:absolute;left:50%;bottom:0;height:62%;transform:translateX(-50%);overflow:visible}
.dhead{position:absolute;left:50%;top:6%;width:230px;height:230px;margin-left:-115px;margin-top:0}
.dhead .core{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:#bda17a}
.seed{position:absolute;left:50%;top:50%;width:0;height:0;transform:rotate(var(--a)) ;transition:none}
.seed .s{position:absolute;left:0;top:0;transform:translate(0,calc(var(--l) * -1));width:1.5px;height:var(--l);background:rgba(120,95,70,.55);transform-origin:bottom}
.seed .s::after{content:"";position:absolute;top:-16px;left:-13px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,rgba(255,255,255,.85) 26% 40%,rgba(255,255,255,0) 72%);filter:drop-shadow(0 0 3px rgba(150,120,90,.45))}
.seed.fly{animation:fly var(--t) cubic-bezier(.2,.6,.3,1) forwards}
@keyframes fly{0%{transform:rotate(var(--a)) translate(0,0);opacity:1}100%{transform:rotate(var(--a)) translate(var(--dx),calc(var(--dy) * -1)) rotate(var(--rot));opacity:0}}
.wishf{position:absolute;left:50%;top:30%;max-width:78%;text-align:center;font-family:var(--hand);font-size:27px;line-height:1.05;color:var(--acd);transform:translate(-50%,0);opacity:0;pointer-events:none;text-shadow:0 0 12px #fff,0 0 4px #fff;animation:wishup 6s ease-out forwards}
@keyframes wishup{0%{opacity:0;transform:translate(-50%,40px) scale(.8)}15%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--wx)),-240px) scale(1.15)}}
.wishlist{margin-top:14px;display:grid;gap:8px}
.wishlist div{background:rgba(255,250,241,.9);border-radius:14px;padding:10px 14px;font-family:var(--hand);font-size:23px;color:var(--acd);animation:fadeUp .6s both;border:1px dashed var(--ac2)}
/* grow flower */
.gstage{position:relative;width:min(340px,92vw);height:440px;margin:0 auto}
.gstage svg{width:100%;height:100%;overflow:visible}
.drop{position:absolute;left:50%;top:-20px;width:14px;height:20px;margin-left:-7px;background:#7cc0e8;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;opacity:0}
.drop.go{animation:drop 1s ease-in forwards}
@keyframes drop{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(310px)}}
.prog{height:10px;border-radius:99px;background:rgba(255,255,255,.7);overflow:hidden;max-width:260px;margin:12px auto;box-shadow:0 0 0 1.5px var(--ac2) inset}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));width:0;transition:width .6s}
/* finale */
.sorry{font-family:var(--hand);font-weight:700;font-size:clamp(54px,17vw,110px);color:var(--acd);text-align:center;line-height:.95;text-shadow:0 4px 0 rgba(255,255,255,.6),0 0 40px var(--glow);margin:14px 0}
.roses{position:relative;height:min(78vw,380px);max-width:520px;margin:6px auto 0}
.roses svg{position:absolute;bottom:0;overflow:visible}
.promise{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line);font-size:17px}
.promise b{color:var(--ac);font-family:var(--serif);font-size:20px}
.react{display:grid;gap:10px}
.rbtn{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--ac2);background:#fffdf8;border-radius:18px;padding:14px 16px;cursor:pointer;font-weight:800}
.rbtn span.m{font-size:24px;color:var(--ac);font-family:var(--serif);width:30px;text-align:center}
.rbtn small{display:block;font-weight:600;color:var(--soft)}
.rbtn:hover{background:var(--paper2)}
/* petals */
#petals{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.pt{position:absolute;top:-30px;color:var(--ac2);animation:fall linear forwards;opacity:.85;font-family:var(--serif)}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.stat{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.stat div{background:var(--paper);border-radius:16px;padding:10px 18px;text-align:center;font-family:var(--serif);font-size:28px;font-weight:700;box-shadow:var(--sh)}
.stat small{display:block;font-family:var(--sans);font-size:12px;color:var(--soft);font-weight:700}
.linkbox{display:flex;gap:8px;background:#fffdf8;border:2px dashed var(--ac2);border-radius:16px;padding:8px 8px 8px 14px;align-items:center;font-weight:800;word-break:break-all}
.linkbox span{flex:1;min-width:0;font-size:15px}
.rep{border-bottom:1px dashed var(--line);padding:10px 0}.rep b{color:var(--acd)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}.rv{opacity:1;transform:none}}
</style>

/* extra: dandelion seeds, roses */
.seed{position:absolute;left:50%;top:50%;width:0;height:0;transform:none}
.sr{position:absolute;left:0;top:0;transform:rotate(var(--a))}
.seed.fly{animation:fly var(--t) cubic-bezier(.2,.6,.3,1) forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) * -1)) rotate(var(--rot));opacity:0}}
.rs{position:absolute;bottom:0;overflow:visible}
.rs .stm{stroke-dasharray:1;stroke-dashoffset:1;fill:none;stroke:#4f7a4a;stroke-width:5;stroke-linecap:round}
.rs .lf{transform-box:fill-box;transform-origin:0 50%;transform:scale(0)}
.rs .bl{transform:translate(100px,var(--by)) scale(0)}
.rs .sway{transform-origin:50% 100%}
.go .rs .stm{animation:draw 3.2s var(--d,0s) ease-out forwards}
.go .rs .lf{animation:pop 1.2s calc(var(--d,0s) + var(--ld)) cubic-bezier(.2,1.4,.4,1) forwards}
.go .rs .bl{animation:bloom 2.4s calc(var(--d,0s) + 2.9s) cubic-bezier(.2,1.2,.4,1) forwards}

@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes bloom{to{transform:translate(100px,var(--by)) scale(var(--bs,1))}}

.stemg{stroke:#4f7a4a;stroke-width:6;fill:none;stroke-linecap:round;stroke-dasharray:1;transition:stroke-dashoffset 1.4s ease}

<script>
/* =========================================================
   apologynote  -  one file, no build step
   1) Run supabase.sql in Supabase
   2) Paste your Project URL + anon key below
   Leave both empty = demo mode (notes live inside the link)
   ========================================================= */
const CONFIG={SUPABASE_URL:"",SUPABASE_ANON_KEY:""};

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const live=()=>!!(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY);
const MARKS=['♥','♡','✦','✧','❀','✿','❁','❦','❧','☾','♪','♫','✎','❋','✶','⚘'];
const THEMES=[['rose','Rose','#b4455a'],['midnight','Dusk','#4a5f9c'],['sage','Sage','#5f8a6b'],['sunset','Sunset','#d9703a'],['lavender','Lavender','#8a6bb8'],['paper','Coffee','#8b6b4a']];
const BGS={doodle:'Sorry doodle',leaf:'Autumn leaf',flower:'Dried flowers',ink:'Ink and blossoms'};
const BGCOL={doodle:'#ffffff',leaf:'#e0cbb3',flower:'#e9decc',ink:'#ead4bc'};
const FLOWERS=[['rose','Rose'],['tulip','Tulip'],['daisy','Daisy'],['sunflower','Sunflower']];
const SONGS=[['','No song'],['m:piano','Soft piano'],['m:box','Music box'],['m:calm','Calm pads'],['m:rain','Rain and chimes']];
const SONGNAME={'m:piano':'Soft piano','m:box':'Music box','m:calm':'Calm pads','m:rain':'Rain and chimes'};
const DEF_WISHES=["I wish we could start the day again.","I wish you'd smile at me like before.","I wish I had said sorry sooner.","I wish for one more chance."];
const STEPG={cover:'♡',photos:'❖',letter:'✎',song:'♪',dandelion:'✿',flower:'❀',sorry:'♥'};
const STEPN={cover:'Envelope',photos:'Photos',letter:'Letter',song:'Song',dandelion:'Dandelion',flower:'Flower',sorry:'Sorry'};
const rnd=(a,b)=>a+Math.random()*(b-a);
const S={note:null,code:null,mode:'live',musicOn:false};
let TO=0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(TO);TO=setTimeout(()=>t.classList.remove('show'),2300)}
const mine=()=>{try{return JSON.parse(localStorage.getItem('an_mine')||'{}')}catch(e){return{}}};
const saveMine=m=>{try{localStorage.setItem('an_mine',JSON.stringify(m))}catch(e){}};
const newToken=()=>{const a=new Uint8Array(20);crypto.getRandomValues(a);return [...a].map(b=>b.toString(16).padStart(2,'0')).join('')};
const b64e=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=s=>JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g,'+').replace(/_/g,'/')))));
const fill=(t,n)=>String(t||'').replace(/\{to\}/g,n.to||'you').replace(/\{from\}/g,n.from||'me');
const origin=()=>location.origin&&location.origin!=='null'?location.origin+location.pathname:location.href.split('#')[0];
const linkFor=code=>origin()+'#/'+code;

/* ---------- api ---------- */
async function rpc(fn,args){
  const k=CONFIG.SUPABASE_ANON_KEY,h={'Content-Type':'application/json',apikey:k};
  if(!k.startsWith('sb_'))h.Authorization='Bearer '+k;
  const r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(args)});
  if(!r.ok)throw new Error('Request failed ('+r.status+')');
  const t=await r.text();return t?JSON.parse(t):null;
}
function norm(n){
  n=Object.assign({to:'',from:'',title:'',message:'',theme:'rose',mark:'♥',promises:[],allow_replies:true,bg:'',song:'',photos:[],wishes:[],flower:'rose'},n||{});
  if(!MARKS.includes(n.mark))n.mark='♥';
  if(!Array.isArray(n.photos))n.photos=[];if(!Array.isArray(n.wishes))n.wishes=[];if(!Array.isArray(n.promises))n.promises=[];
  return n;
}
const params=(n,extra)=>Object.assign({p_to:n.to,p_from:n.from,p_title:n.title,p_message:n.message,p_theme:n.theme,p_mark:n.mark,p_promises:n.promises,p_allow_replies:n.allow_replies,p_bg:n.bg,p_song:n.song,p_photos:n.photos,p_wishes:n.wishes,p_flower:n.flower},extra);

/* ---------- background ---------- */
const PAGEBG={home:'doodle',create:'leaf',templates:'flower',guide:'ink',faq:'leaf',mine:'flower',privacy:'ink',made:'doodle',cover:'doodle',photos:'flower',letter:'leaf',song:'ink',dandelion:'leaf',flower:'flower',sorry:'doodle'};
function setBg(page,n){
  let k=(n&&n.bg)||PAGEBG[page]||'doodle',el=$('#bg'),src=BG_IMG[k]||(k.startsWith('data:')?k:BG_IMG.doodle);
  const col=BGCOL[k]||'#f1e4d0';
  el.style.backgroundColor=col;el.style.backgroundImage='url('+src+')';
  document.body.style.background=col;
  $('#bgv').style.background=k==='doodle'?'rgba(255,250,241,.9)':'linear-gradient(180deg,rgba(255,248,236,.2),rgba(255,248,236,.04) 40%,rgba(255,248,236,.3))';
}
function setTheme(t){document.documentElement.setAttribute('data-theme',t||'rose')}

/* ---------- music (synth, no copyrighted audio) ---------- */
const Music={c:null,m:null,t:null,n:null,on:false,song:'',i:0,
 init(){if(this.c)return true;const A=window.AudioContext||window.webkitAudioContext;if(!A)return false;
  this.c=new A();this.m=this.c.createGain();this.m.gain.value=.9;
  const lp=this.c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3400;
  const dl=this.c.createDelay();dl.delayTime.value=.34;const fb=this.c.createGain();fb.gain.value=.32;dl.connect(fb);fb.connect(dl);
  this.m.connect(lp);lp.connect(this.c.destination);lp.connect(dl);dl.connect(this.c.destination);return true},
 hz:m=>440*Math.pow(2,(m-69)/12),
 nt(m,t,d,type,v){const c=this.c,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=this.hz(m);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(this.m);o.start(t);o.stop(t+d+.1)},
 play(song){
  if(!song||song.slice(0,2)!=='m:'){this.stop();return}
  if(this.on&&this.song===song)return;
  this.stop();if(!this.init())return;
  if(this.c.state==='suspended')this.c.resume();
  this.song=song;this.on=true;this.i=0;S.musicOn=true;
  const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]],PENT=[72,74,76,79,81,84,86];let pos=3;
  const c=this.c;
  if(song==='m:rain'){const len=c.sampleRate*2,b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let k=0;k<len;k++)d[k]=Math.random()*2-1;
   const s=c.createBufferSource();s.buffer=b;s.loop=true;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1800;f.Q.value=.5;const g=c.createGain();g.gain.value=.16;
   s.connect(f);f.connect(g);g.connect(this.m);s.start();this.n=s}
  const ms={'m:piano':430,'m:box':330,'m:calm':3600,'m:rain':900}[song];
  const tick=()=>{const t=c.currentTime+.05,i=this.i++;
   if(song==='m:piano'){const ch=CH[Math.floor(i/8)%4],p=[0,1,2,1,0,2,1,2][i%8];
     if(i%8===0)this.nt(ch[0]-12,t,2.8,'sine',.22);this.nt(ch[p]+12*(i%8>3?1:0),t,1.9,'triangle',.2);
     if(i%16===6)this.nt(ch[2]+24,t,2,'sine',.1)}
   else if(song==='m:box'){pos=Math.max(0,Math.min(6,pos+Math.round(rnd(-2,2))));if(Math.random()<.82)this.nt(PENT[pos],t,1.5,'sine',.2);
     if(i%8===0)this.nt(PENT[0]-24,t,2.5,'sine',.12)}
   else if(song==='m:calm'){const ch=CH[i%4];ch.forEach((m,k)=>this.nt(m+(k?0:-12),t,5.4,'sine',.1));this.nt(ch[2]+12,t+1.2,3,'triangle',.05)}
   else{if(Math.random()<.55)this.nt(PENT[Math.floor(rnd(0,5))]+(Math.random()<.3?12:0),t,2.4,'sine',.13)}};
  tick();this.t=setInterval(tick,ms);syncMusicUI()},
 stop(){clearInterval(this.t);this.t=null;if(this.n){try{this.n.stop()}catch(e){}this.n=null}this.on=false;this.song='';S.musicOn=false;syncMusicUI()}
};

let IO=null;
function observe(){
  if(!IO)IO=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');IO.unobserve(e.target)}}),{threshold:.12});
  $$('.rv:not(.in)').forEach(el=>IO.observe(el));
  const g=$('.roses:not(.go)');if(g){if(!window.IO2)window.IO2=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('go');window.IO2.unobserve(e.target)}}),{threshold:.3});window.IO2.observe(g)}
}

function typeInto(el,text,speed=24,done){

}

function fileToJpeg(file,maxSide,maxChars){
  return new Promise((res,rej)=>{
    const fr=new FileReader();fr.onerror=()=>rej(new Error('Could not read the picture'));
    fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('That file is not a picture I can open'));
      im.onload=()=>{let sc=Math.min(1,maxSide/Math.max(im.width,im.height)),q=.8,out='';
        for(let k=0;k<8;k++){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
          const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
          out=c.toDataURL('image/jpeg',q);if(out.length<=maxChars)return res(out);q-=.08;sc*=.88}
        rej(new Error('That picture is too big'))};im.src=fr.result};
    fr.readAsDataURL(file)});
}

   (a.length<max?`<button class="chip" data-a="addlist" data-key="${key}">+ Add one</button>`:'');

function photosHTML(){
  return E.photos.map((p,i)=>`<div class="ph"><img src="${p.s}" alt=""><input type="text" data-cap="${i}" maxlength="80" placeholder="A few words about this photo" value="${esc(p.c)}"><button class="x" data-a="rmphoto" data-i="${i}" aria-label="Remove">✕</button></div>`).join('')+
   (E.photos.length<4?`<label class="btn ghost sm" style="cursor:pointer">+ Choose from album<input type="file" id="phfile" accept="image/*" multiple hidden></label>`:'<div class="hint">4 photos is the maximum.</div>');

  </section></div>`);
}

function pickBg(k){E.bg=k;setBg('create',{bg:k||''});if($('#bgs'))$$('#bgs .opt').forEach(o=>o.classList.toggle('on',o.dataset.v===k))}

function collect(){
  const n=norm({to:E.to.trim(),from:E.from.trim(),title:E.title.trim(),message:E.message.trim(),theme:E.theme,mark:E.mark,
    promises:E.promises.map(x=>x.trim()).filter(Boolean).slice(0,4),allow_replies:!!E.allow_replies,bg:E.bg,song:E.song,
    photos:E.photos.map(p=>({s:p.s,c:(p.c||'').trim()})),wishes:E.wishes.map(x=>x.trim()).filter(Boolean).slice(0,6),flower:E.flower});
  return n;
}
async function publish(){
  const n=collect(),err=$('#cerr'),btn=$('#pub');
  const bad=!n.to?'Please add their name.':n.message.length<10?'Your letter needs at least 10 characters.':'';
  if(bad){err.innerHTML=`<div class="err">${bad}</div>`;err.scrollIntoView({behavior:'smooth',block:'center'});return}
  err.innerHTML='';btn.disabled=true;btn.textContent='Sending...';
  try{
    const m=mine();
    if(live()){
      if(E._edit){const tk=m[E._edit]&&m[E._edit].token;const ok=await rpc('update_note',params(n,{p_code:E._edit,p_token:tk}));if(!ok)throw new Error('This device cannot edit that note.');
        m[E._edit].to=n.to;m[E._edit].mark=n.mark;saveMine(m);const c=E._edit;E=null;toast('Saved');location.hash='#/made/'+c;return}
      const tk=newToken(),code=await rpc('create_note',params(n,{p_token:tk}));
      m[code]={token:tk,to:n.to,mark:n.mark,at:Date.now()};saveMine(m);E=null;petals(30);location.hash='#/made/'+code;
    }else{
      const lite=Object.assign({},n,{photos:[],bg:n.bg.startsWith('data:')?'':n.bg}),code=E._edit||('demo-'+Math.random().toString(36).slice(2,7));
      m[code]={token:'',to:n.to,mark:n.mark,at:Date.now(),data:n,link:origin()+'#/d/'+b64e(lite)};saveMine(m);E=null;petals(30);location.hash='#/made/'+code;
    }
  }catch(e){btn.disabled=false;btn.textContent=E&&E._edit?'Save changes':'Publish ♥';err.innerHTML=`<div class="err">${esc(e.message||'Something went wrong')}. Please try again.</div>`}
}
async function loadForEdit(code){
  const m=mine()[code];if(!m)return false;
  let n;
  if(live())n=await rpc('get_note_owner',{p_code:code,p_token:m.token});else n=m.data;
  if(!n)return false;n=norm(n);
  E={to:n.to,from:n.from,title:n.title,message:n.message,theme:n.theme,mark:n.mark,promises:n.promises.slice(),allow_replies:n.allow_replies,bg:n.bg,song:n.song,photos:n.photos.map(p=>({s:p.s,c:p.c||''})),wishes:n.wishes.slice(),flower:n.flower,_edit:code};
  if(!E.wishes.length)E.wishes=[''];if(!E.promises.length)E.promises=[''];
  return true;
}

<script>
/* ---------- the journey (what the receiver opens) ---------- */
const stepsOf=n=>['cover'].concat(n.photos.length?['photos']:[],['letter'],n.song?['song']:[],['dandelion','flower','sorry']);
const nextOf=(n,s)=>{const a=stepsOf(n),i=a.indexOf(s);return a[i+1]||null};
const go=(step)=>{location.hash=S.base+(step&&step!=='cover'?'/'+step:'')};
function navBar(n,step){
  const a=stepsOf(n),cur=a.indexOf(step);
  return `<div class="jn"><div class="bar">${a.map((s,i)=>`<a class="d ${i===cur?'on':i<cur?'done':''}" href="${S.base}${s==='cover'?'':'/'+s}" title="${STEPN[s]}" aria-label="${STEPN[s]}">${STEPG[s]}</a>`).join('')}${n.song&&n.song[0]==='m'?`<button class="mus ${Music.on?'play':''}" data-a="music" aria-label="Music">♪</button>`:''}</div></div>`;
}
const nextBtn=(n,s,label)=>{const x=nextOf(n,s);return x?`<div class="next"><a class="btn big" href="${S.base}/${x}">${label||'Next'} →</a></div>`:''};
const banner=()=>S.preview?`<div class="center" style="padding:8px"><a class="btn sm ghost" data-a="backedit" href="#/create">← Back to editing (preview)</a></div>`:'';
function frame(n,step,body){return banner()+`<div class="pg" data-step="${step}"><div class="wrap">${body}</div></div>`+navBar(n,step)}

function journeyPage(n,step){
  const to=esc(n.to||'you'),from=esc(n.from||'someone who cares');
  if(step==='photos'){
    return frame(n,step,`<div class="title fu"><span class="eyebrow">remember these?</span><h2>Little memories</h2></div>
     <div class="polaroids">${n.photos.map((p,i)=>`<div class="pol ${n.photos.length===1?'solo':''} rv" style="transition-delay:${i*.2}s"><img src="${p.s}" alt=""><p>${esc(p.c)}</p></div>`).join('')}</div>
     <p class="center hand rv" style="font-size:28px;color:var(--acd);margin:18px 0 0">Every one of them matters to me.</p>${nextBtn(n,step)}`);
  }
  if(step==='letter'){
    return frame(n,step,`<div class="title fu"><span class="eyebrow">I wrote this for you</span><h2>${esc(fill(n.title,n)||'A letter')}</h2></div>
     <div class="paperl fu" id="paper" data-a="skip"><div class="to">Dear ${to},</div><p class="tx" id="ltx"></p><div class="sg2" id="lsig" style="opacity:0;transition:opacity 1s">with love, ${from} ${esc(n.mark)}</div></div>
     <div class="hint center" style="margin-top:8px">tap the paper to skip the typing</div><div id="lnext" style="opacity:0;transition:opacity 1s">${nextBtn(n,step)}</div>`);
  }
  if(step==='song'){
    const yt=n.song.startsWith('yt:');
    return frame(n,step,`<div class="title fu"><span class="eyebrow">press play</span><h2>A song for you</h2></div>
     <div class="card center fu">${yt?`<div style="position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden"><iframe src="https://www.youtube-nocookie.com/embed/${n.song.slice(3)}?rel=0&playsinline=1" title="Song" style="position:absolute;inset:0;width:100%;height:100%;border:0" allow="autoplay; encrypted-media" allowfullscreen></iframe></div>`:
      `<div class="vinyl ${Music.on?'spin':''}"><span>${esc(SONGNAME[n.song]||'Song')}</span></div><div class="eq ${Music.on?'on':''}">${'<i></i>'.repeat(14)}</div><button class="btn big" data-a="music" id="pbtn">${Music.on?'Pause':'Play'} ♪</button>`}
      <p class="hand" style="font-size:26px;color:var(--acd);margin:18px 0 0">Listen while you think of me, ${to}.</p></div>${nextBtn(n,step)}`);
  }
  if(step==='dandelion'){
    return frame(n,step,`<div class="title fu"><span class="eyebrow">make a wish</span><h2>Blow the dandelion</h2></div>
     <div class="dstage fu" id="dstage"><svg class="stem" viewBox="0 0 40 260" width="40"><path d="M20 0 C14 70 28 150 20 260" stroke="#5f8a4a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M22 150 C40 130 52 140 56 120 C42 118 28 126 22 150Z" fill="#78a35c"/></svg><div class="dhead" id="dhead" data-a="blow"><div class="core"></div></div></div>
     <div class="center"><button class="btn big" data-a="blow" id="blowb">Blow ✿</button><div class="hint" id="dhint" style="margin-top:8px">tap the dandelion or the button</div></div>
     <div class="wishlist" id="wl"></div><div id="dnext" style="opacity:.0;pointer-events:none;transition:opacity 1s">${nextBtn(n,step)}</div>`);
  }
  if(step==='flower'){
    const fl=FLOWERS.find(f=>f[0]===n.flower)||FLOWERS[0];
    return frame(n,step,`<div class="title fu"><span class="eyebrow">grow it together</span><h2>Water the seed</h2></div>
     <div class="gstage fu" id="gstage"><div class="drop" id="drop"></div><svg viewBox="0 0 340 440" id="gsvg">
       <ellipse cx="170" cy="436" rx="86" ry="8" fill="rgba(60,30,20,.2)"/>
       <path class="stemg" id="gs" pathLength="1" d="M170 372 C150 322 194 250 170 172" style="stroke-dashoffset:1"/>
       <g transform="translate(166 330) rotate(-28)"><g class="lfg" id="gl1"><path d="${LEAF}" fill="#6fa162" stroke="#4f7a4a"/></g></g>
       <g transform="translate(174 268) scale(-1 1) rotate(-30)"><g class="lfg" id="gl2"><path d="${LEAF}" fill="#5f9455" stroke="#4f7a4a"/></g></g>
       <g transform="translate(170 166)"><ellipse id="gbud" rx="14" ry="20" fill="var(--ac)" stroke="var(--acd)" stroke-width="2" style="opacity:0;transition:opacity .8s"/></g>
       <g transform="translate(170 150)"><g class="bloomg" id="gb" style="transform:scale(0)">${bloomSVG(n.flower)}</g></g>
       <path d="M108 374 L232 374 L216 434 L124 434Z" fill="#c98b62" stroke="#a96e48" stroke-width="2"/><rect x="100" y="362" width="140" height="18" rx="7" fill="#dca37c" stroke="#a96e48" stroke-width="2"/>
     </svg></div>
     <div class="prog"><i id="gp"></i></div>
     <p class="center hand" id="gtxt" style="font-size:27px;color:var(--acd);margin:4px 0 14px">A ${esc(fl[1].toLowerCase())} seed is sleeping. Give it water.</p>
     <div class="center"><button class="btn big" data-a="water" id="wb">Water it</button></div><div id="fnext" style="opacity:0;pointer-events:none;transition:opacity 1s">${nextBtn(n,step,'One last thing')}</div>`);
  }
  if(step==='sorry'){
    const word=[...'I am sorry'].map((c,i)=>`<span style="display:inline-block;animation:fadeUp .7s ${.4+i*.14}s both">${c===' '?'&nbsp;':c}</span>`).join('');
    const can=n.allow_replies&&S.canReply!==false;
    return banner()+`<div class="pg" data-step="sorry" style="justify-content:flex-start;padding-top:50px"><div class="wrap center">
     <span class="eyebrow fu">${to}, </span><div class="sorry">${word}</div>
     <p class="hand fu" style="font-size:30px;color:var(--soft);margin:0;animation-delay:2s">from ${from} ${esc(n.mark)}</p>
     ${finaleRoses(n.flower)}</div></div>
     <div class="wrap" style="padding-bottom:140px">
     ${n.promises.length?`<div class="card tape rv" style="margin-bottom:22px"><h3 style="font-size:32px;text-align:center;margin-bottom:6px">My promises</h3>${n.promises.map(p=>`<div class="promise"><b>${esc(n.mark)}</b><span>${esc(p)}</span></div>`).join('')}</div>`:''}
     ${can?`<div class="card rv" style="margin-bottom:22px"><h3 style="font-size:32px;text-align:center">What do you say?</h3><p class="center hint" style="margin:4px 0 14px">Whatever you choose, ${from} will see it.</p><div class="react">

       <button class="rbtn" data-a="react" data-k="talk"><span class="m">✎</span><div>Let us talk<small>I would like to hear you out</small></div></button>
       <button class="rbtn" data-a="react" data-k="time"><span class="m">☾</span><div>I need some time<small>Please give me a little space</small></div></button></div></div>`:''}
     <div class="card glass center rv"><p class="hand" style="font-size:28px;margin:0 0 12px;color:var(--acd)">Keep it, or pass it on</p><div class="row center"><button class="btn sm ghost" data-a="img">Save as image</button><button class="btn sm ghost" data-a="replay" >Replay ✦</button><a class="btn sm" href="#/create">Make one of my own</a></div></div></div>`+navBar(n,'sorry');

    <div class="env fu" id="env" data-a="openenv" style="animation-delay:.3s"><div class="back"></div><div class="lt"><div>for ${to}<br><small style="font-size:20px;opacity:.7">from ${from}</small></div></div><div class="fr"></div><div class="flap"></div><div class="seal">${esc(n.mark)}</div></div>
    <p class="hand fu" style="font-size:30px;color:var(--acd);margin:6px 0 0;animation-delay:.6s">tap the seal to open</p>
    <p class="hint fu" style="animation-delay:.8s">${n.song&&n.song[0]==='m'?'Sound on, please. ':''}It will only take a minute.</p></div></div>`;
}

/* per-step behaviours after render */
let D=null,G=0;
function afterJourney(n,step){
  if(step==='letter'){
    const body=fill(n.message,n),el=$('#ltx');
    const fin=()=>{const s=$('#lsig'),x=$('#lnext');if(s)s.style.opacity=1;if(x)x.style.opacity=1};
    const g=n.to?new RegExp('^\\s*(dear\\s+)?'+n.to.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[,:!]?\\s*\\n+','i'):null;
    typeInto(el,g?body.replace(g,''):body,22,fin);
  }
  if(step==='dandelion'){
    const h=$('#dhead'),N=46,seeds=[];
    for(let i=0;i<N;i++){const s=document.createElement('div');s.className='seed';s.innerHTML='<div class="sr"><div class="s"></div></div>';
      const a=i*360/N+rnd(-3,3);s.firstChild.style.setProperty('--a',a+'deg');s.firstChild.firstChild.style.setProperty('--l',rnd(62,102)+'px');h.appendChild(s);seeds.push(s)}
    seeds.sort(()=>Math.random()-.5);
    D={n,seeds,i:0,W:(n.wishes.length?n.wishes:DEF_WISHES).map(w=>fill(w,n))};
  }
  if(step==='flower'){G=0}
  if(step==='sorry'){window.scrollTo(0,0)}
}
function blow(){
  if(!D||D.i>=D.W.length)return;
  const left=D.seeds.filter(s=>!s.classList.contains('fly')),cnt=D.i===D.W.length-1?left.length:Math.ceil(D.seeds.length/D.W.length);
  left.slice(0,cnt).forEach(s=>{s.style.setProperty('--dx',rnd(-220,300)+'px');s.style.setProperty('--dy',rnd(160,420)+'px');s.style.setProperty('--t',rnd(3,5.5)+'s');s.style.setProperty('--rot',rnd(-200,200)+'deg');s.style.animationDelay=rnd(0,.5)+'s';s.classList.add('fly')});
  const w=D.W[D.i++],st=$('#dstage'),f=document.createElement('div');f.className='wishf';f.textContent=w;f.style.setProperty('--wx',rnd(-60,60)+'px');st.appendChild(f);setTimeout(()=>f.remove(),6200);
  const wl=$('#wl');if(wl){const d=document.createElement('div');d.textContent='✿ '+w;wl.appendChild(d)}
  if(D.i>=D.W.length){const b=$('#blowb');if(b){b.disabled=true;b.textContent='All blown ✿'}const h=$('#dhint');if(h)h.textContent='Every wish is on its way to you.';const x=$('#dnext');if(x){x.style.opacity=1;x.style.pointerEvents='auto'}}
  else{const h=$('#dhint');if(h)h.textContent='Wish '+D.i+' of '+D.W.length+'. Again!'}
}
function water(){
  if(G>=4)return;G++;
  const dr=$('#drop');dr.classList.remove('go');void dr.offsetWidth;dr.classList.add('go');
  setTimeout(()=>{
    const so=[1,.72,.42,0,0][G];$('#gs').style.strokeDashoffset=so;
    if(G>=1)$('#gl1').style.transform='scale(1)';if(G>=2)$('#gl2').style.transform='scale(1)';
    $('#gbud').style.opacity=G===3?1:0;
    $('#gp').style.width=G*25+'%';
    const t=['','A tiny sprout appears.','It is reaching for the light...','A bud! Almost there...','It bloomed. This one is for you.'][G];
    $('#gtxt').textContent=G===4?fill('This '+((FLOWERS.find(f=>f[0]===(S.note||{}).flower)||['',''])[1]).toLowerCase()+' grew just for you, {to}.',S.note):t;
    if(G===4){$('#gb').style.transform='scale(1.05)';petals(24);const b=$('#wb');b.disabled=true;b.textContent='Bloomed';const x=$('#fnext');x.style.opacity=1;x.style.pointerEvents='auto'}
    else $('#wb').textContent=['Water it','Water again','Once more','Last drop'][G];
  },700);
}
</script>
<script>
/* ---------- made page, share, image, qr ---------- */
async function pageMade(code){
  const m=mine()[code];
  if(!m)return shell(`<div class="wrap"><section class="hero"><h2 class="h2">This note was made on another device</h2><p class="lead" style="margin:10px auto 20px">Only the browser that created it can manage it. You can still open it.</p><a class="btn" href="#/${esc(code)}">Open it</a></section></div>`);
  let n,views=0,reps=[];
  if(live()){try{n=norm(await rpc('get_note_owner',{p_code:code,p_token:m.token}));const st=await rpc('note_stats',{p_code:code,p_token:m.token});if(st){views=st.views;reps=st.reactions||[]}}catch(e){}}
  else n=norm(m.data);
  if(!n)return page404();
  const link=live()?linkFor(code):m.link;S.madeLink=link;S.note=n;
  return shell(`<div class="wrap"><section class="blk"><div class="title fu"><span class="eyebrow">it is ready</span><h1 class="h2">Your gift for ${esc(n.to)} ${esc(n.mark)}</h1></div>
   <div class="card tape fu"><p style="margin-top:0;color:var(--soft)">Send this link. They open the envelope and walk through your pages.</p>
    <div class="linkbox"><span>${esc(link)}</span><button class="btn sm" data-a="copy" data-t="${esc(link)}">Copy</button></div>
    <div class="row" style="margin-top:14px"><button class="btn" data-a="share">Share ♥</button><button class="btn ghost" data-a="qr">QR code</button><button class="btn ghost" data-a="img">Save as image</button></div>
    <div class="row" style="margin-top:10px"><a class="btn sm ghost" href="${live()?'#/'+esc(code):link.slice(link.indexOf('#'))}">Open it as ${esc(n.to)}</a><a class="btn sm ghost" href="#/edit/${esc(code)}">Edit</a><a class="btn sm ghost" href="#/mine">My notes</a></div>
    ${live()?'':'<div class="hint" style="margin-top:12px">Demo mode: the text travels inside the link. Photos and a custom background stay on this device until you connect Supabase.</div>'}</div>
   ${live()?`<div class="stat"><div>${views}<small>views</small></div><div>${reps.length}<small>replies</small></div></div>${reps.map(r=>`<div class="rep"><b>${esc(r.name||'Someone')}</b> ${r.kind==='forgive'?'forgave you ♥':r.kind==='talk'?'wants to talk ✎':'needs some time ☾'}${r.message?`<div class="hand" style="font-size:22px">${esc(r.message)}</div>`:''}</div>`).join('')}`:''}
   <div class="card glass rv" style="margin-top:22px"><h3 style="font-size:26px">Posting on Instagram?</h3><p style="color:var(--soft);margin:6px 0 12px">Add this to your story or bio:</p><div class="linkbox"><span>I made something for you. Open it: ${esc(link)}</span><button class="btn sm ghost" data-a="copy" data-t="I made something for you. Open it: ${esc(link)}">Copy</button></div></div></section></div>`);
}
async function doShare(){
  const n=S.note||{},link=S.madeLink||location.href;
  const d={title:'A little something for you',text:'I made something for you. Please open it '+(n.mark||'♥'),url:link};
  try{if(navigator.share){await navigator.share(d);return}}catch(e){if(e&&e.name==='AbortError')return}
  copy(d.text+' '+link);
}
function modal(html){closeModal();const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="card">${html}</div>`;m.addEventListener('click',e=>{if(e.target===m)closeModal()});document.body.appendChild(m)}
function closeModal(){const m=$('#modal');if(m)m.remove()}
function loadQR(){return new Promise((res,rej)=>{if(window.qrcode)return res();const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function showQR(){
  const link=S.madeLink||location.href;
  modal(`<h3 style="font-size:28px">Scan to open</h3><canvas id="qrc" width="240" height="240" style="max-width:100%;margin:12px auto;display:block"></canvas><div class="hint" style="word-break:break-all">${esc(link)}</div><div class="row center" style="margin-top:14px"><button class="btn sm" data-a="qrdl">Download</button><button class="btn sm ghost" data-a="qrx">Close</button></div>`);
  try{await loadQR();const q=qrcode(0,'M');q.addData(link);q.make();const c=$('#qrc'),x=c.getContext('2d'),k=q.getModuleCount(),px=Math.floor(240/(k+4));c.width=c.height=px*(k+4);x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.fillStyle='#3d2a2b';
    for(let r=0;r<k;r++)for(let q2=0;q2<k;q2++)if(q.isDark(r,q2))x.fillRect((q2+2)*px,(r+2)*px,px,px)}catch(e){const c=$('#qrc');if(c)c.outerHTML='<p>Could not draw the QR (are you offline?). Copy the link instead.</p>'}
}
function wrapText(x,t,mw){const out=[];t.split('\n').forEach(p=>{let l='';p.split(' ').forEach(w=>{const tt=l?l+' '+w:w;if(x.measureText(tt).width>mw&&l){out.push(l);l=w}else l=tt});out.push(l)});return out}
async function saveImage(){
  const n=S.note||SAMPLE,W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
  const k=n.bg||'doodle',src=BG_IMG[k]||(k.startsWith('data:')?k:BG_IMG.doodle);
  x.fillStyle=BGCOL[k]||'#f1e4d0';x.fillRect(0,0,W,H);
  await new Promise(r=>{const im=new Image();im.onload=()=>{const s=Math.max(W/im.width,H/im.height);x.drawImage(im,(W-im.width*s)/2,(H-im.height*s)/2,im.width*s,im.height*s);r()};im.onerror=r;im.src=src});
  x.fillStyle='rgba(255,250,241,.84)';const px=80,py=300,pw=W-160,ph=H-600;x.beginPath();x.roundRect?x.roundRect(px,py,pw,ph,40):x.rect(px,py,pw,ph);x.fill();
  const cs=getComputedStyle(document.documentElement),ac=cs.getPropertyValue('--acd').trim()||'#8c2d42';
  x.textAlign='center';x.fillStyle=ac;x.font='700 150px Caveat,cursive';x.fillText('I am sorry',W/2,py+190);
  x.font='80px "Cormorant Garamond",serif';x.fillText(n.mark||'♥',W/2,py+290);
  x.fillStyle='#3d2a2b';x.font='700 54px Caveat,cursive';x.textAlign='left';
  let msg=fill(n.message,n);if(msg.length>520)msg=msg.slice(0,520).replace(/\s+\S*$/,'')+'...';
  const ls=wrapText(x,msg,pw-120);let y=py+390;ls.slice(0,16).forEach(l=>{x.fillText(l,px+60,y);y+=66});
  x.textAlign='right';x.fillStyle=ac;x.font='700 66px Caveat,cursive';x.fillText('with love, '+(n.from||'me'),px+pw-60,py+ph-60);
  x.textAlign='center';x.fillStyle='#6b5154';x.font='700 34px Nunito,sans-serif';x.fillText('made with apologynote',W/2,H-110);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='sorry.png';document.body.appendChild(a);a.click();a.remove();toast('Image saved')});
}

/* ---------- router ---------- */
const SITE=['create','edit','made','templates','guide','faq','privacy','mine'];
const CACHE={};let RT=0;
async function route(){
  const my=++RT,raw=location.hash.replace(/^#\/?/,''),parts=raw.split('/').filter(Boolean),h=parts[0]||'',app=$('#app');
  closeModal();window.scrollTo(0,0);setTheme('rose');S.preview=false;S.canReply=true;
  const put=(html,pg,n,after)=>{if(my!==RT)return;app.innerHTML=html;setBg(pg,n);observe();syncMusicUI();after&&after()};
  const jr=(n,base,step,pg)=>{S.note=n;S.base=base;setTheme(n.theme);
    if(!stepsOf(n).includes(step))step='cover';
    if(!(step==='song'&&n.song)&&!(n.song&&n.song[0]==='m'&&step!=='cover'))Music.stop();
    put(journeyPage(n,step),step,n,()=>{setTheme(n.theme);afterJourney(n,step)});
    if(step!=='cover'&&n.song&&n.song[0]==='m'&&!Music.on&&0)Music.play(n.song)};
  if(!h){Music.stop();return put(pageHome(),'home')}
  if(SITE.includes(h)||h==='sample'||h==='preview'||h==='d'){}else{}
  if(h==='templates'){Music.stop();return put(pageTemplates(),'templates')}
  if(h==='guide'){Music.stop();return put(pageGuide(),'guide')}
  if(h==='faq'){Music.stop();return put(pageFaq(),'faq')}
  if(h==='privacy'){Music.stop();return put(pagePrivacy(),'privacy')}
  if(h==='mine'){Music.stop();return put(pageMine(),'mine')}
  if(h==='create'){Music.stop();return put(pageCreate(),'create',E)}
  if(h==='edit'){Music.stop();put('<div class="pg center"><div class="sorry" style="font-size:54px">Opening...</div></div>','create');let ok=false;try{ok=await loadForEdit(parts[1])}catch(e){}
    if(my!==RT)return;if(!ok){toast('You can only edit notes made on this device');location.hash='#/mine';return}return put(pageCreate(),'create',E)}
  if(h==='made'){Music.stop();put('<div class="pg center"><div class="sorry" style="font-size:54px">One moment...</div></div>','made');const html=await pageMade(parts[1]);return put(html,'made',S.note&&mine()[parts[1]]?S.note:null)}
  if(h==='sample')return jr(norm(SAMPLE),'#/sample',parts[1]||'cover');
  if(h==='preview'){if(!E){location.hash='#/create';return}S.preview=true;S.canReply=false;const n=S.pv||norm(collect());return jr(n,'#/preview',parts[1]||'cover')}
  if(h==='d'){try{const n=norm(b64d(parts[1]||''));n.code='demo';S.canReply=false;return jr(n,'#/d/'+parts[1],parts[2]||'cover')}catch(e){return put(page404(),'home')}}
  /* a real note code */
  const code=h.toLowerCase();let n=CACHE[code];
  if(!n){put('<div class="pg center"><div class="sorry" style="font-size:54px">Opening...</div></div>','cover');
    if(!live()){const m=mine()[code];n=m&&m.data?norm(m.data):null}
    else{try{n=await rpc('get_note',{p_code:code});if(n)n=norm(n)}catch(e){n=null}}
    if(my!==RT)return;if(n)CACHE[code]=n}
  if(!n)return put(page404(),'home');
  n.code=code;return jr(n,'#/'+code,parts[1]||'cover');
}
let rq=0;const sched=()=>{if(rq)return;rq=1;Promise.resolve().then(()=>{rq=0;route()})};
window.addEventListener('hashchange',sched);window.addEventListener('popstate',sched);

/* ---------- actions ---------- */
const A={
 menu(){$('#nav').classList.toggle('open')},
 tpl(b){applyTpl(b.dataset.id);location.hash='#/create'},
 tplin(b){applyTpl(b.dataset.id);E.theme=E.theme;const keep=[E.to,E.from];route();toast('Idea added. Make it yours.')},
 theme(b){E.theme=b.dataset.v;setTheme(E.theme);$$('.sw').forEach(s=>s.classList.toggle('on',s===b));refresh('flowers',FLOWERS.map(f=>`<button class="chip ${E.flower===f[0]?'on':''}" data-a="flower" data-v="${f[0]}" style="display:flex;align-items:center;gap:4px;flex-direction:column;border-radius:18px;background:${E.flower===f[0]?'':'#fffdf8'}">${flowerPrev(f[0])}<span>${f[1]}</span></button>`).join(''))},
 mark(b){E.mark=b.dataset.v;$$('#marks .chip').forEach(s=>s.classList.toggle('on',s===b))},
 song(b){E.song=b.dataset.v;$('#yt').value='';$$('#songs .chip').forEach(s=>s.classList.toggle('on',s===b));if(E.song)Music.play(E.song);else Music.stop()},
 songprev(){if(E.song&&E.song[0]==='m'){Music.on&&Music.song===E.song?Music.stop():Music.play(E.song)}else toast(E.song?'Open the preview to hear the YouTube song':'Choose a song first')},
 flower(b){E.flower=b.dataset.v;$$('#flowers .chip').forEach(s=>{const on=s===b;s.classList.toggle('on',on);s.style.background=on?'':'#fffdf8'})},
 bg(b){pickBg(b.dataset.v)},
 addlist(b){const k=b.dataset.key;E[k].push('');refresh(k,listHTML(k,k==='wishes'?'I wish...':'I promise...',k==='wishes'?6:4))},
 rmlist(b){const k=b.dataset.key;E[k].splice(+b.dataset.i,1);if(!E[k].length)E[k]=[''];refresh(k,listHTML(k,k==='wishes'?'I wish...':'I promise...',k==='wishes'?6:4))},
 rmphoto(b){E.photos.splice(+b.dataset.i,1);refresh('photos',photosHTML())},
 preview(){const n=collect();if(!n.to||n.message.length<10){$('#cerr').innerHTML='<div class="err">Add their name and a letter first, then preview.</div>';return}Music.stop();S.pv=n;location.hash='#/preview'},
 publish(){publish()},
 backedit(){S.pv=null;Music.stop()},
 openenv(b){const env=$('#env'),n=S.note;if(env.classList.contains('open'))return;env.classList.add('open');petals(18);if(n.song&&n.song[0]==='m')Music.play(n.song);setTimeout(()=>go(nextOf(n,'cover')),1900)},
 music(){const n=S.note;if(Music.on)Music.stop();else Music.play(n.song);const p=$('#pbtn');if(p)p.textContent=(Music.on?'Pause':'Play')+' ♪'},
 blow(){blow()},water(){water()},
 skip(){const t=$('#ltx');t&&t._skip&&t._skip()},
 replay(){Music.stop();go('cover')},
 react(b){const k=b.dataset.k,n=S.note,t={forgive:'I forgive you',talk:'Let us talk',time:'I need some time'}[k];
  modal(`<h3 style="font-size:28px">${t}</h3><p class="hint">Say a little something to ${esc(n.from||'them')} (optional).</p><input type="text" id="rn" maxlength="60" placeholder="Your name (optional)" style="margin-bottom:10px"><textarea id="rm" maxlength="500" style="min-height:100px;font-size:20px" placeholder="Write here..."></textarea><div class="row center" style="margin-top:12px"><button class="btn" data-a="sendreact" data-k="${k}">Send</button><button class="btn ghost" data-a="qrx">Cancel</button></div>`)},
 async sendreact(b){const n=S.note,k=b.dataset.k;b.disabled=true;
  try{if(live()&&!S.preview&&n.code!=='sample'){const ok=await rpc('add_reaction',{p_code:n.code,p_kind:k,p_name:$('#rn').value,p_message:$('#rm').value});if(!ok)throw new Error('Replies are closed')}
   modal(`<div style="font-size:42px;color:var(--ac)" class="hand">${k==='forgive'?'♥':k==='talk'?'✎':'☾'}</div><h3 style="font-size:28px">Sent</h3><p>${esc(n.from||'They')} will see your answer.</p><button class="btn" data-a="qrx">Close</button>`);if(k==='forgive')petals(40)}
  catch(e){b.disabled=false;toast(e.message||'Could not send')}},
 img(){saveImage()},
 copy(b){copy(b.dataset.t)},share(){doShare()},qr(){showQR()},qrx(){closeModal()},
 qrdl(){const c=$('#qrc');if(!c)return;c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='apologynote-qr.png';document.body.appendChild(a);a.click();a.remove()})},
 async stats(b){const c=b.dataset.code,m=mine()[c],box=$('#st-'+c);if(!live()){box.innerHTML='<div class="hint" style="margin-top:10px">Replies need Supabase. In demo mode nothing is stored online.</div>';return}
  try{const st=await rpc('note_stats',{p_code:c,p_token:m.token});box.innerHTML=st?`<div class="stat"><div>${st.views}<small>views</small></div><div>${(st.reactions||[]).length}<small>replies</small></div></div>`+(st.reactions||[]).map(r=>`<div class="rep"><b>${esc(r.name||'Someone')}</b> ${r.kind==='forgive'?'forgave you ♥':r.kind==='talk'?'wants to talk ✎':'needs some time ☾'}${r.message?`<div class="hand" style="font-size:22px">${esc(r.message)}</div>`:''}</div>`).join(''):'<div class="hint">Not found.</div>'}catch(e){toast('Could not load')}},
 async del(b){const c=b.dataset.code;if(!confirm('Delete this note for good?'))return;const m=mine();try{if(live())await rpc('delete_note',{p_code:c,p_token:m[c].token});delete m[c];saveMine(m);delete CACHE[c];toast('Deleted');route()}catch(e){toast('Could not delete')}}
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');
  if(b&&A[b.dataset.a]){if(b.tagName==='BUTTON'||b.tagName==='DIV'||b.tagName==='LABEL')e.preventDefault();A[b.dataset.a](b,e)}
  const a=e.target.closest('a[href^="#"]');
  if(a){const h=a.getAttribute('href');e.preventDefault();if(location.hash!==h){try{history.pushState(null,'',h)}catch(_){location.hash=h;return}}sched()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k&&E)E[t.dataset.k]=t.value;
  else if(t.dataset.list&&E)E[t.dataset.list][+t.dataset.i]=t.value;
  else if(t.dataset.cap!==undefined&&E)E.photos[+t.dataset.cap].c=t.value;
  else if(t.id==='yt'&&E){const id=ytId(t.value);if(id){E.song='yt:'+id;Music.stop();$$('#songs .chip').forEach(s=>s.classList.remove('on'))}}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='allow'&&E)E.allow_replies=t.checked;
  if(t.id==='phfile'&&E){const fs=[...t.files].slice(0,4-E.photos.length);for(const f of fs){try{E.photos.push({s:await fileToJpeg(f,720,110000),c:''})}catch(er){toast(er.message)}}refresh('photos',photosHTML())}
  if(t.id==='bgfile'&&E&&t.files[0]){try{E.bg=await fileToJpeg(t.files[0],720,260000);setBg('create',{bg:E.bg});$$('#bgs .opt').forEach(o=>o.classList.remove('on'));toast('Background set')}catch(er){toast(er.message)}}
});
